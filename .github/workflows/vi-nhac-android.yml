name: Build Tro Ly Chi Tieu APK

on:
  push:
    branches: ["codex/vi-nhac-android"]
    paths:
      - "vi-nhac/**"
      - ".github/workflows/vi-nhac-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run parser tests
        working-directory: vi-nhac
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: vi-nhac
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TroLyChiTieu-debug-apk
          path: vi-nhac/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
