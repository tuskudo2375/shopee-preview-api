name: Build Mola AI Camera V1

on:
  push:
    branches: [ mola-ai-camera-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mola-ai-camera
          cat mola-ai-chunks/chunk* | base64 -d > /tmp/mola-ai-project.zip
          unzip -q /tmp/mola-ai-project.zip -d mola-ai-camera
          python3 - <<'PY'
          p='mola-ai-camera/app/src/main/java/titus/molaai/CameraController.java'
          s=open(p, encoding='utf-8').read()
          s=s.replace('activity.getDisplay().getRotation()', 'activity.getWindowManager().getDefaultDisplay().getRotation()')
          s=s.replace('private final Activity activity;', 'private Activity activity;')
          s=s.replace('private final Listener listener;', 'private Listener listener;')
          open(p,'w',encoding='utf-8').write(s)
          p='mola-ai-camera/app/src/main/java/titus/molaai/MainActivity.java'
          s=open(p, encoding='utf-8').read()
          s=s.replace('import android.widget.TextureView;', 'import android.view.TextureView;')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        working-directory: mola-ai-camera
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MolaAI-Camera-V1
          path: mola-ai-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
