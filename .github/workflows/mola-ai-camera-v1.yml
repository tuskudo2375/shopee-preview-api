name: Build Mola AI Camera V1

on:
  push:
    branches: [ mola-ai-camera-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mola-ai-camera
          mkdir -p mola-ai-camera
          cat mola-ai-chunks/chunk* | base64 -d > /tmp/mola-ai-project.zip
          unzip -q /tmp/mola-ai-project.zip -d mola-ai-camera

          # Camera path stays on the V1.2 CameraX + ColorOS logical SAT engine.
          cp mola-ai-patches/CameraController.java mola-ai-camera/app/src/main/java/titus/molaai/CameraController.java

          # V1.3 subject selection is entirely local: face-first + saliency fallback + tracker.
          cp mola-ai-patches/LocalSubjectAnalyzer.java mola-ai-camera/app/src/main/java/titus/molaai/LocalSubjectAnalyzer.java
          sed -i 's/new FaceDetector(rgb565.getWidth(), rgb565.getHeight(), faces)/new FaceDetector(rgb565.getWidth(), rgb565.getHeight(), faces.length)/' mola-ai-camera/app/src/main/java/titus/molaai/LocalSubjectAnalyzer.java
          python3 mola-ai-patches/apply_v13.py

          cat > mola-ai-camera/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          python3 - <<'PY'
          p='mola-ai-camera/app/build.gradle'
          s=open(p, encoding='utf-8').read()
          s=s.replace("versionCode 1", "versionCode 3")
          s=s.replace("versionName '0.1.0'", "versionName '0.1.3-local'")
          if 'dependencies {' not in s:
              s += '''\n\ndependencies {\n    implementation 'androidx.activity:activity:1.9.3'\n    implementation 'androidx.camera:camera-core:1.4.2'\n    implementation 'androidx.camera:camera-camera2:1.4.2'\n    implementation 'androidx.camera:camera-lifecycle:1.4.2'\n    implementation 'androidx.camera:camera-view:1.4.2'\n}\n'''
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        working-directory: mola-ai-camera
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MolaAI-Camera-V1.3-Local
          path: mola-ai-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
