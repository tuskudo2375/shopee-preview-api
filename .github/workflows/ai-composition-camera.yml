name: Build AI Composition Camera APK
on:
  workflow_dispatch:
  push:
    branches: [ ai-composition-camera-build ]
    paths:
      - 'ci/AICompositionCamera_v0.1.2_polished_src.zip'
      - '.github/workflows/ai-composition-camera.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ci/AICompositionCamera_v0.1.2_polished_src.zip'
      - '.github/workflows/ai-composition-camera.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract polished source
        run: |
          rm -rf build-v012
          mkdir build-v012
          unzip -q ci/AICompositionCamera_v0.1.2_polished_src.zip -d build-v012
      - name: Build and lint debug APK
        working-directory: build-v012/AICompositionCamera
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify APK
        run: |
          APK='build-v012/AICompositionCamera/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: AICompositionCamera-v0.1.2-polished
          path: build-v012/AICompositionCamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
