name: Build AI Composition Camera APK
on:
  workflow_dispatch:
  push:
    branches: [ ai-composition-camera-build ]
    paths:
      - 'ai-composition-camera/**'
      - '.github/workflows/ai-composition-camera.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-composition-camera/**'
      - '.github/workflows/ai-composition-camera.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-composition-camera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: APK SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AICompositionCamera-debug
          path: ai-composition-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
